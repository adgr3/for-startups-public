<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Nie znaleziono · For Startups</title>
<meta name="description" content="Strona nie istnieje. Wróć do katalogu aktualnych i nadchodzących możliwości dla startupów.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="/404.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b1020;--panel:#141b30;--ink:#eef2ff;--muted:#a7b1d0;--accent:#7ab0ff;--accent-ink:#07112a;--line:#26304d;--upcoming:#f5bd3c;--radius:12px}
*{box-sizing:border-box}
html{color-scheme:dark}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
main{max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:32px}
h1{font-size:26px;margin:0 0 10px}
p{color:var(--muted);margin:0 0 8px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
a{color:var(--accent)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:10px 16px;border-radius:9px;font-size:15px}
a:focus-visible{outline:3px solid var(--upcoming);outline-offset:2px;border-radius:4px}
</style>
</head>
<body>
<main>
<h1>404 — Nie znaleziono strony</h1>
<p>Ta strona nie istnieje albo została przeniesiona.</p>
<p>Katalog możliwości dla startupów znajdziesz na stronie głównej. Wszystkie
opublikowane programy są też wypisane w <a href="/sitemap.xml">mapie strony</a>.</p>
<div class="actions">
  <a class="btn" href="/">Katalog możliwości</a>
  <a href="/historia/">Archiwum</a>
</div>
</main>
</body>
</html>
